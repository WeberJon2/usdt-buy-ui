<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy USDT</title>
  <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    button {
      margin: 4px;
      padding: 8px 12px;
      font-size: 16px;
    }
    #connectBtn {
      background-color: #4CAF50;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <h2>Send USDT to Contract</h2>
  <p>Make sure you're on <strong>BSC Mainnet</strong></p>
  <input id="amount" type="text" placeholder="Amount in USDT (e.g. 1)" />
  <br/><br/>
  <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
  <button onclick="approve()">Approve</button>
  <button onclick="buy()">BUY</button>

  <p id="status"></p>
  <p id="walletInfo"></p>

  <script>
    const usdtAddress = "0x55d398326f99059fF775485246999027B3197955";
    const contractAddress = "0x0269D198F6e2393830d7e52146c14E885e3c458D";
    const contractABI = [
      "function BUY(uint256 amount) external",
      "function SetWalletReceipe(address _receipe) external"
    ];
    const erc20ABI = [
      "function approve(address spender, uint256 amount) external returns (bool)"
    ];

    let provider, signer, contract, usdt;

    async function connectWallet() {
      try {
        if (typeof window.ethereum !== 'undefined') {
          provider = new ethers.providers.Web3Provider(window.ethereum);
          await provider.send("eth_requestAccounts", []);
          signer = provider.getSigner();
        } else {
          const walletConnectProvider = new window.WalletConnectProvider.default({
            rpc: {
              56: "https://bsc-dataseed.binance.org/"
            },
            chainId: 56
          });
          await walletConnectProvider.enable();
          provider = new ethers.providers.Web3Provider(walletConnectProvider);
          signer = provider.getSigner();
        }

        contract = new ethers.Contract(contractAddress, contractABI, signer);
        usdt = new ethers.Contract(usdtAddress, erc20ABI, signer);

        const address = await signer.getAddress();
        const network = await provider.getNetwork();

        document.getElementById("status").innerText = "Wallet connected!";
        document.getElementById("walletInfo").innerText = `Address: ${address}\nChain ID: ${network.chainId}`;
      } catch (err) {
        console.error("Connection error:", err);
        document.getElementById("status").innerText = "Wallet connection failed.";
        document.getElementById("walletInfo").innerText = err.message || err;
      }
    }

    async function approve() {
      if (!signer) return alert("Please connect wallet first.");
      const amount = ethers.utils.parseUnits(document.getElementById("amount").value, 6);
      try {
        const tx = await usdt.approve(contractAddress, amount);
        document.getElementById("status").innerText = "Approving...";
        await tx.wait();
        document.getElementById("status").innerText = "Approved successfully!";
      } catch (e) {
        console.error(e);
        document.getElementById("status").innerText = "Error during approval.";
      }
    }

    async function buy() {
      if (!signer) return alert("Please connect wallet first.");
      const amount = parseFloat(document.getElementById("amount").value) * 1e6;
      try {
        const tx = await contract.BUY(amount);
        document.getElementById("status").innerText = "Processing BUY...";
        await tx.wait();
        document.getElementById("status").innerText = "USDT sent successfully!";
      } catch (e) {
        console.error(e);
        document.getElementById("status").innerText = "Error during BUY.";
      }
    }
  </script>
</body>
</html>
